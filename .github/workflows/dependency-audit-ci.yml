name: Dependency Audit CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Audit web dependencies (npm audit)
        id: npm-audit
        continue-on-error: true
        working-directory: apps/web
        run: |
          npm audit --package-lock-only --json > "$GITHUB_WORKSPACE/npm-audit.json" || true

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Audit API dependencies (pip-audit)
        id: pip-audit
        continue-on-error: true
        working-directory: apps/api
        run: |
          uv export --frozen --format requirements-txt --no-emit-project -o requirements.txt
          uvx pip-audit -r requirements.txt --format json --output "$GITHUB_WORKSPACE/pip-audit.json" || true
          rm -f requirements.txt
